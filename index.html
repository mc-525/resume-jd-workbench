<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本事 · JD 简历适配器</title>
<style>
:root{--ink:#172b2d;--muted:#667172;--paper:#f7f3ec;--line:#ded8cc;--red:#bd503b;--sage:#477267}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}header,main,footer{max-width:1120px;margin:auto;padding-inline:24px}header{height:68px;display:flex;align-items:center;border-bottom:1px solid var(--line)}.brand{font:600 26px Georgia,serif}.brand b,.eyebrow{color:var(--red)}header span{margin-left:18px;padding-left:18px;border-left:1px solid var(--line);color:var(--muted);font-size:13px}.hero,.work{display:grid;grid-template-columns:1.4fr .8fr;gap:42px}.hero{padding:70px 0 34px}.hero h1{max-width:14ch;margin:0;font:500 clamp(34px,5vw,62px)/1.12 Georgia,serif}.hero p{align-self:end;color:var(--muted)}.work{grid-template-columns:1fr 1fr;border:1px solid var(--line);background:#fffdfa;box-shadow:0 20px 45px -35px #263b3b}.panel{padding:28px}.panel:first-child{border-right:1px solid var(--line);background:#f1eadf}h2{margin:0 0 18px;font:500 25px Georgia,serif}.eyebrow{margin:0 0 5px;font-size:12px;font-weight:600}label{display:block;margin-top:17px;font-size:13px;font-weight:600}textarea{width:100%;min-height:150px;padding:12px;border:1px solid #cfc5b5;background:#fffdfa;font:14px/1.7 inherit;resize:vertical}button{min-height:42px;padding:0 14px;border:1px solid var(--red);background:var(--red);color:#fff;font:600 14px inherit;cursor:pointer}.ghost{background:transparent;border-color:#b6aca0;color:var(--ink)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.empty{padding:60px 0;color:var(--muted)}.scorebox{display:flex;gap:20px;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line)}.ring{width:105px;height:105px;border:9px solid #e6eee8;border-top-color:var(--sage);border-right-color:var(--sage);border-radius:50%;display:grid;place-content:center;text-align:center;font:32px ui-monospace}.ring small{font:11px sans-serif}.signal,.rewrite{padding:12px 0;border-top:1px solid #eee9df}.hit{color:#29604e}.gap{color:#8c5b13}.note,footer{color:var(--muted);font-size:12px}footer{padding-top:25px;padding-bottom:25px}@media(max-width:720px){.hero,.work{grid-template-columns:1fr}.panel:first-child{border-right:0;border-bottom:1px solid var(--line)}}
</style></head>
<body><header><div class="brand">本<b>事</b></div><span>JD 简历适配器</span></header><main>
<section class="hero"><h1>把经历写成岗位看得懂的本事。</h1><p>粘贴你的简历和岗位 JD，提取关键要求、核对已有证据，并生成一份待本人复核的岗位适配版本。</p></section>
<section class="work"><div class="panel"><p class="eyebrow">01 / 输入</p><h2>你的经历，与目标岗位</h2><label>简历底稿</label><textarea id="resume" placeholder="粘贴你的教育、项目、实习和技能经历"></textarea><label>岗位 JD</label><textarea id="jd" placeholder="粘贴岗位职责与任职要求"></textarea><div class="actions"><button onclick="analyze()">开始匹配</button><button class="ghost" onclick="example()">填入示例</button></div><p class="note">内容仅在当前浏览器处理；不应虚构经历、成果或数据。</p></div>
<div class="panel"><p class="eyebrow">02 / 输出</p><h2 id="title">等待你的输入</h2><div id="empty" class="empty">分析完成后，这里会呈现匹配度、已命中能力信号，以及可核对的改写方向。</div><div id="report" hidden><div class="scorebox"><div class="ring"><span id="score">--</span><small>匹配度</small></div><div><b id="verdict"></b><p id="summary" class="note"></p></div></div><div id="signals"></div><h3>建议改写方向</h3><div id="rewrites"></div><div class="actions"><button onclick="word()">下载 Word（.doc）</button><button class="ghost" onclick="pdf()">生成 PDF</button></div><p class="note">PDF 会打开浏览器打印窗口，请选择“另存为 PDF”。</p></div></div></section></main><footer>岗位匹配是辅助判断；投递前请逐项核对事实、数据和项目归属。</footer>
<script>
const resume=document.getElementById('resume'),jd=document.getElementById('jd'),empty=document.getElementById('empty'),report=document.getElementById('report'),title=document.getElementById('title'),score=document.getElementById('score'),verdict=document.getElementById('verdict'),summary=document.getElementById('summary'),signals=document.getElementById('signals'),rewrites=document.getElementById('rewrites');const nl=String.fromCharCode(10);const keys=[['用户增长',['拉新','留存','社群']],['内容策略',['内容运营','选题','内容策划']],['数据分析',['数据','Excel','复盘']],['活动转化',['活动','转化','报名']],['跨团队',['协作','联合','沟通']],['项目推进',['推进','项目管理','排期']],['用户研究',['调研','访谈','问卷']],['运营复盘',['复盘','总结','优化']]];let chosen=[];
function example(){resume.value='林沅｜内容与增长运营'+nl+'负责校内活动的内容运营，完成选题、发布与数据整理；搭建社群活动节奏，联合设计与学生组织推进 15 人协作。'+nl+'技能：内容策划、用户调研、Excel 数据整理、活动复盘。';jd.value='产品运营实习生'+nl+'负责用户增长与内容策略，基于数据分析优化活动转化；需要跨团队项目推进能力，熟悉用户研究与运营复盘。'}
function analyze(){let r=resume.value.trim(),j=jd.value.trim();if(!r||!j){alert('请同时填写简历内容和岗位 JD。');return}let s=keys.filter(x=>j.includes(x[0])).map(x=>({name:x[0],hit:[x[0],...x[1]].some(y=>r.includes(y))}));if(!s.length)s=[{name:'岗位关键词',hit:false}];let hits=s.filter(x=>x.hit),pct=Math.round(38+hits.length/s.length*54);title.textContent='匹配已生成';empty.hidden=true;report.hidden=false;score.textContent=pct;verdict.textContent=pct>=70?'已经具备投递基础':'先补强关键证据';summary.textContent='已命中 '+hits.length+' 项岗位信号；所有建议均需由本人核对后使用。';signals.innerHTML=s.map(x=>'<div class="signal '+(x.hit?'hit':'gap')+'"><b>'+x.name+'</b><br><span class="note">'+(x.hit?'已在简历中找到对应经历。':'暂未找到明确表述，核对是否有真实经历可补充。')+'</span></div>').join('');chosen=['把职责改成行动与结果','补充真实的范围、协作对象与量化结果'];rewrites.innerHTML=chosen.map(x=>'<div class="rewrite"><b>'+x+'</b><p class="note">避免只写“负责、参与、协助”；使用“做了什么 → 如何推进 → 得到什么结果”的结构。</p></div>').join('')}
function text(){return '岗位适配简历 - 待本人复核'+nl+nl+'目标岗位 JD'+nl+jd.value+nl+nl+'简历底稿'+nl+resume.value+nl+nl+'建议修改方向'+nl+chosen.join(nl)+nl+nl+'请本人核对所有事实，不应虚构经历或数据。'}
function word(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text()],{type:'application/msword'}));a.download='岗位适配简历-待复核.doc';a.click()}
function pdf(){let w=open('','_blank');w.document.write('<title>岗位适配简历</title><pre style="white-space:pre-wrap;font:14px/1.7 Microsoft YaHei,Arial;padding:24px"></pre>');w.document.querySelector('pre').textContent=text();w.print()}
</script></body></html>
